  <text x="124" y="769" fill="#E5EDF8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Why this layout works</text>
  <text x="124" y="794" fill="#8FA4C1" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. Search inputs become the visual primary area.</text>
  <text x="124" y="817" fill="#8FA4C1" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Date inputs are wide enough to show exact values without truncation.</text>
  <text x="700" y="794" fill="#8FA4C1" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. Action buttons are grouped by purpose and stacked into two rows.</text>
  <text x="700" y="817" fill="#8FA4C1" font-family="Segoe UI, Arial, sans-serif" font-size="15">4. Bottom utility row stays lightweight and does not compete with search.</text>
